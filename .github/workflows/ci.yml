name: CI

on:
  push:
    # La production tourne sur qa/pc-2026-07-27, pas sur master : sans ce
    # motif, typecheck, tests et Playwright ne s'exécutaient JAMAIS sur le
    # code réellement livré aux clients.
    branches: [master, 'qa/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Typecheck backend
        run: npx tsc --noEmit
        working-directory: apps/backend

      - name: Typecheck web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Typecheck guest
        run: npx tsc --noEmit
        working-directory: apps/guest

      - name: Backend tests
        run: npm test
        working-directory: apps/backend

      - name: Audit dependencies (haute sévérité)
        run: npm audit --audit-level=high || true

  e2e:
    runs-on: ubuntu-latest

    # Les parcours critiques ont besoin de vraies données : sans base, le
    # backend démarre en mode dégradé et seul l'admin de repli existe — les
    # écrans testés (clients, factures, plan de salle) seraient vides.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creorga
          POSTGRES_PASSWORD: password
          POSTGRES_DB: creorga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creorga"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://creorga:password@localhost:5432/creorga_ci
      JWT_SECRET: ci-jwt-secret-creorga
      JWT_REFRESH_SECRET: ci-refresh-secret-creorga
      # Les tests enchaînent des connexions volontairement erronées : sans
      # cela le quota anti-force-brute (10 / 5 min) coupe la suite.
      RATE_LIMIT_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/backend

      - name: Seed demo data
        run: npm run db:seed:rich
        working-directory: apps/backend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
