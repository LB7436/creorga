<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creorga POS</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #07070d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      @keyframes pulse-ring { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:.6;transform:scale(1.08)} }
      @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      @keyframes slide-up { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
      .pulse-ring { animation: pulse-ring 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .fade-in { animation: fade-in .2s ease forwards; }
      .slide-up { animation: slide-up .25s ease forwards; }
      /* Cibles tactiles : 44 px minimum sur les écrans au doigt (tablette,
         téléphone) — l'audit recensait des boutons de 22 à 36 px dans une
         caisse pensée pour être touchée. Sur PC à la souris (pointer: fine),
         la densité d'origine est conservée. Les styles inline ne fixent que
         padding/taille de police, jamais min-height : aucun conflit. */
      @media (pointer: coarse) {
        button, [role="button"], input[type="checkbox"], input[type="radio"], select {
          min-height: 44px;
          min-width: 44px;
        }
      }
      /* Le téléphone doit pouvoir faire défiler les écrans empilés. */
      @media (max-width: 899px) {
        html, body, #root { overflow: auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
